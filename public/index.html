const vm=()=>{const f=U.fm;return{'Submitter valid':!!(f.sn||'').trim()&&ph(f.sp),'Full legal 3-part name':(f.cn||'').trim().split(/\s+/).length>=3,'Valid Mogadishu phone':ph(f.cp),'Age 18+':+f.ca>=18,'Seminar selected':!!f.sm}};
function modal(){const m=U.m;if(m.k=='dos'){const d=S.del.find(x=>x.id==m.id),s=sm(d.sem),C=['Proof of ward residency & family registry','Verified biometric photo & national ID','Conflict of interest & code of conduct signed'];
return`<div class="ov" data-a="close"><div class="mo"><div class="mh"><b>Delegate Dossier & Stamp · ${d.id}</b><button class="x" data-a="close">✕</button></div><div class="mb"><h3>${e(d.name)}</h3><p class="mut">${d.age} yrs · ${d.sex=='F'?'Female':'Male'} · ${e(d.job)}<br>${fp(d.ph)} · ${e(d.ward)}</p><p>Seminar: <b>${e(s.t)}</b></p><p class="mut sm">Nominated by ${e(d.by)} · ${d.date}</p><h4>CHAIRPERSON CHECKLIST</h4>${C.map((c,i)=>`<label class="ck"><input type="checkbox" data-a="chk" data-i="${i}" ${U.chk[i]?'checked':''}> ${c}</label>`).join('')}<div class="att">“By applying the Official Ward Stamp, the Chairperson attests that this candidate meets federal ministerial eligibility.”</div><textarea data-n="1" placeholder="Chairperson note (optional)…">${e(U.note)}</textarea><button class="btn p w" data-a="stamp" data-id="${d.id}" style="margin-top:0">Apply Ward Stamp & Endorse</button><div class="g2"><button class="btn" data-a="info">Request Info</button><button class="btn bd" data-a="ret" data-id="${d.id}">Return Dossier</button></div></div></div></div>`}
const n=U.ns;if(m.k=='us')return umodal(n);if(m.k=='pw')return pmodal();return`<div class="ov" data-a="close"><div class="mo"><div class="mh"><b>${n.id?'Edit Seminar':'Create New Seminar'}</b><button class="x" data-a="close">✕</button></div><div class="mb">${[['t','Seminar title'],['m','Ministry'],['v','Venue'],['dt','Dates (e.g. Feb 2–6, 2027)'],['dl','Registration deadline'],['cap','Total seats'],['q','Seats per ward']].map(x=>`<label>${x[1]}</label><input data-s="${x[0]}" value="${e(n[x[0]]||'')}">`).join('')}<button class="btn p w" data-a="savesem">${n.id?'Save Changes':'Save as Draft'}</button></div></div></div>`}
const view=()=>U.tab=='dash'?(U.r=='admin'?dashA():U.r=='chair'?dashC():dashS()):U.tab=='ppl'?ppl():U.tab=='reg'?reg():U.tab=='usr'?usrv():semv();
const login=()=>{const r=R[U.lr];return`<div class="lg"><div style="text-align:right"><button class="lnk" data-a="lang" style="margin:0">${LG=='en'?'Af-Soomaali':'English'}</button></div><div class="crest">🏛️</div><h1>GSMS Official Gateway</h1><p class="mut">Government Seminar Management & Neighborhood Delegation Portal</p><h4>SELECT CLEARANCE TIER</h4><div class="tiers">${Object.keys(R).map(k=>`<button class="tier ${k==U.lr?'on':''}" data-a="tier" data-v="${k}"><b>${R[k].n}</b><small>${R[k].d}</small></button>`).join('')}</div><div class="card"><label>Official Government Email</label><input value="${r.m}"><label>Ministerial Credentials</label><input type="password" placeholder="Password" autocomplete="current-password"><button class="btn p w" data-a="login">🔒 Authorize & Access Portal</button></div><p class="sm mut">Unauthorized access is prohibited under the Federal Cyber-Legislation Act 2023.</p></div>`};
function render(){const a=$('#app');if(!U.r){a.innerHTML=login();tl(a);return}const r=R[U.r];
a.innerHTML=`<header class="hd"><b>🏛️ GSMS<small>Ministry Portal</small></b><span>${r.n}</span><button class="lnk" data-a="lang" style="color:#fff;margin:0">${LG=='en'?'SO':'EN'}</button></header><div class="rb">🛡️ <b>${r.n}:</b> ${r.s}<button class="lnk" data-a="out">Switch</button></div><main>${view()}</main><nav>${NAV[U.r].map(t=>`<button class="${U.tab==t[0]?'on':''}" data-a="${t[0]=='out'?'out':'go'}" data-v="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('')}</nav>${U.m?modal():''}`;tl(a)}
function next(){const f=U.fm,s=U.st,n=(f.cp||'').replace(/\s/g,'');
if(s==1&&!(f.sn||'').trim())return'Enter the submitter name';if(s==1&&!ph(f.sp))return'Enter a valid +252 phone number for the submitter';
if(s==2){if(!vm()['Full legal 3-part name'])return'Candidate needs a full 3-part legal name';if(!ph(n))return'Enter a valid Mogadishu phone (+252 + 9 digits)';if(!(+f.ca>=18))return'Candidate must be 18 or older';if(!(f.co||'').trim())return'Enter the candidate’s occupation';
if(S.del.some(d=>d.st!='rejected'&&(d.ph==n||d.name.toLowerCase()==f.cn.trim().toLowerCase())))return'Duplicate detected in the national registry'}
if(s==3&&!f.sm)return'Select a seminar cohort';return''}
document.addEventListener('click',x=>{const a=x.target.closest('[data-a]');if(!a)return;if(a.classList.contains('ov')&&x.target.closest('.mo'))return;const D=a.dataset,k=D.a;
if(k=='lang'){LG=LG=='en'?'so':'en';try{localStorage.setItem('gl',LG)}catch(_){}}else if(k=='tier'){U.lr=D.v}else if(k=='login'){doLogin();return}else if(k=='out'){U.r=null;U.m=null;TK='';try{sessionStorage.removeItem('tk')}catch(_){}}else if(k=='reset'){S=seed();save();toast('Demo data reset');return}
else if(k=='go'){U.tab=D.v;U.sel=[];U.m=null;scrollTo(0,0);if(D.v=='usr')loadUsers()}
else if(k=='set'){up(D.id,D.st,D.st=='rejected'?'Failed ministry verification':'');toast('Delegate '+ST[D.st].toLowerCase())}
else if(k=='endorse'){up(D.id,'pending');toast('Endorsed & forwarded to the Ministry')}
else if(k=='review'){U.m={k:'dos',id:D.id};U.chk=[0,0,0];U.note=''}
else if(k=='close'){U.m=null}else if(k=='chk'){U.chk[+D.i]^=1}
else if(k=='stamp'){if(!U.chk.every(Boolean))return toast('Complete all checklist items first');up(D.id,'pending');U.m=null;toast('Ward stamp applied · forwarded')}
else if(k=='ret'){if(!U.note.trim())return toast('Add a note explaining the return');up(D.id,'rejected',U.note.trim());U.m=null;toast('Dossier returned to nominator')}
else if(k=='info')return toast('Information request sent to nominator');
else if(k=='cred')return toast('Digital credential issued');
else if(k=='exp'){doExport(D.v);return}else if(k=='fil'){U.f=D.v}
else if(k=='sel'){U.sel=a.checked?[...U.sel,D.id]:U.sel.filter(i=>i!=D.id)}
else if(k=='selall'){const ids=flt().map(d=>d.id);U.sel=a.checked?[...new Set([...U.sel,...ids])]:U.sel.filter(i=>!ids.includes(i))}
else if(k=='batch'){let n=0;S.del.forEach(d=>{if(U.sel.includes(d.id)&&(d.st=='pending'||d.st=='ward')){d.st='approved';d.why='';n++}});if(n)API('POST','/api/delegates/batch',{ids:U.sel.slice()}).then(loadData,loadData);U.sel=[];toast(n?n+' delegate(s) approved':'Select pending delegates first')}
else if(k=='mng'){U.sm=D.id;U.f='all';U.q='';U.tab='ppl'}
else if(k=='pub'){sm(D.id).st='open';API('POST','/api/seminars/'+D.id+'/publish').then(loadData,loadData);toast('Seminar published')}
else if(k=='edsem'){const s=sm(D.id);U.ns={id:s.id,t:s.t,m:s.m,v:s.v,dt:s.dt,dl:s.dl,cap:s.cap,q:s.q};U.m={k:'ns'}}else if(k=='newsem'){U.ns={};U.m={k:'ns'}}else if(k=='adduser'){U.ns={role:'chair',ward:'Hodan Ward 3'};U.m={k:'us'}}else if(k=='saveuser'){API('POST','/api/users',U.ns).then(()=>{U.m=null;toast('User created');loadUsers()},()=>{});return}else if(k=='utog'){API('POST','/api/users/toggle',{email:D.email}).then(loadUsers,loadUsers);return}else if(k=='upw'){U.ns={};U.m={k:'pw',email:D.email}}else if(k=='savepw'){API('POST','/api/users/password',{email:U.m.email,password:U.ns.password}).then(()=>{U.m=null;toast('Password updated');render()},()=>{});return}
else if(k=='savesem'&&U.ns.id){const n=U.ns;if(!(n.t||'').trim()||!(+n.cap>0))return toast('Enter a title and total seats');API('PUT','/api/seminars/'+n.id,n).then(()=>{toast('Seminar updated');loadData()},()=>{});U.m=null}else if(k=='savesem'){const n=U.ns;if(!(n.t||'').trim()||!(+n.cap>0))return toast('Enter a title and total seats');S.sem.push({id:Math.max(...S.sem.map(s=>s.id))+1,t:n.t.trim(),m:n.m||'Ministry TBD',ref:'GSMS-2026-NEW-'+(S.sem.length+1),v:n.v||'TBD',dt:n.dt||'TBD',dl:n.dl||'TBD',cap:+n.cap,base:0,q:+n.q||10,st:'draft'});API('POST','/api/seminars',S.sem[S.sem.length-1]).then(loadData,loadData);U.m=null;toast('Seminar saved as draft')}
else if(k=='nx'){const m=next();if(m)return toast(m);U.st++}
else if(k=='pv'){U.st--}
else if(k=='clr'){U.fm=blank();U.st=1}
else if(k=='draft')return toast('Draft kept for this session');
else if(k=='sub'){const f=U.fm,v=vm();if(!Object.values(v).every(Boolean)||!f.ok)return toast(f.ok?'Validation matrix incomplete':'Confirm the nomination guarantee');const s=sm(f.sm);
if(S.del.filter(d=>d.sem==s.id&&d.ward==f.sw&&d.st!='rejected').length>=s.q||filled(s)>=s.cap)return toast('Quota exceeded for this ward or seminar');
const id='SOM-'+(9001+S.del.length);S.del.push({id,name:f.cn.trim(),age:+f.ca,sex:f.cs=='Male'?'M':'F',job:f.co.trim(),ph:f.cp.replace(/\s/g,''),ward:f.sw,dist:W.find(w=>w[0]==f.sw)[1],sem:s.id,by:R[U.r].u,st:U.r=='admin'?'pending':'ward',why:'',date:new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})});API('POST','/api/delegates',S.del[S.del.length-1]).then(loadData,loadData);U.fm=blank();U.st=1;U.tab='ppl';U.f='all';U.sm='all';U.q='';toast('Nomination '+id+' lodged')}
render()});
document.addEventListener('input',x=>{const t=x.target;if(t.id=='q'){U.q=t.value;$('#lst').innerHTML=lst();tl($('#lst'));return}if(t.dataset.k)U.fm[t.dataset.k]=t.type=='checkbox'?t.checked:t.value;if(t.dataset.s)U.ns[t.dataset.s]=t.value;if(t.dataset.n)U.note=t.value});
document.addEventListener('change',x=>{const t=x.target;if(t.dataset.k){U.fm[t.dataset.k]=t.type=='checkbox'?t.checked:t.value;if(t.dataset.r){U.fm.sm=+t.value;render()}}else if(t.dataset.f=='sm'){U.sm=t.value;render()}});
if(TK){try{U.r=JSON.parse(atob(TK.split('.')[1])).role;U.fm=blank();loadData()}catch(_){TK='';render()}}else render();
</script></body></html>
